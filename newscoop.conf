<VirtualHost *:80>
      DocumentRoot /var/www/newscoop
      ServerName docker.newscoop
      ServerAlias docker.newscoop
      DirectoryIndex index.php index.html
      <Directory /var/www/newscoop>
                Options -Indexes +FollowSymLinks -MultiViews
                AllowOverride All
                Order allow,deny
                Allow from all
                Require all granted
      </Directory>
</VirtualHost>
