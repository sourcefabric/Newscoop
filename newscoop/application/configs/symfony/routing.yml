admin_login:
    pattern:   /admin/login
    defaults:  { _controller: NewscoopNewscoopBundle:Security:login }
    options: { i18n: false }
admin_login_check:
    pattern:   /admin/login_check
    options: { i18n: false }
admin_logout:
    pattern:   /admin/logout{php}
    defaults: { php: ".php" }
    options: { i18n: false }
fos_js_routing:
    prefix: /admin
    resource: "@FOSJsRoutingBundle/Resources/config/routing/routing.xml"
    options: { i18n: false }
_bazinga_exposetranslation:
    prefix: /admin
    resource: "@BazingaExposeTranslationBundle/Resources/config/routing/routing.yml"
    options: { i18n: false }
fos_oauth_server_token:
    resource: "@FOSOAuthServerBundle/Resources/config/routing/token.xml"
    options:
        expose: true
        i18n: false
fos_oauth_server_authorize:
    resource: "@FOSOAuthServerBundle/Resources/config/routing/authorize.xml"
    options:
        expose: true
        i18n: false
oauth_login:
    pattern:   /oauth/v2/auth_login
    defaults:  { _controller: NewscoopGimmeBundle:Oauth:login }
    options: { i18n: false }
oauth_login_check:
    pattern:   /oauth/v2/auth_login_check
    options: { i18n: false }
gimme:
    type: rest
    prefix: /api
    resource: "@NewscoopGimmeBundle/Resources/config/routing.yml"
    options: { i18n: false }
NelmioApiDocBundle:
    resource: "@NelmioApiDocBundle/Resources/config/routing.yml"
    prefix:   /documentation/rest-api
    options: { i18n: false }
NewscoopGimmeBundleConfigureApi:
    resource: "@NewscoopGimmeBundle/Controller/ConfigureApiController.php"
    prefix:   /
    type:     annotation
    options: { i18n: false }
newscoop:
    prefix: /
    resource: "@NewscoopNewscoopBundle/Resources/config/routing.yml"
    options: { i18n: false }
plugins:
    resource: .
    type: plugins
zendBridge:
    prefix: /
    resource: "@NewscoopZendBridgeBundle/Resources/config/routing.yml"
    options: { i18n: false }